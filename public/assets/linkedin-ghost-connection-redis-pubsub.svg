<svg viewBox="0 0 1080 1350" width="1080" height="1350" xmlns="http://www.w3.org/2000/svg">

  <rect x="0" y="0" width="1080" height="1350" fill="#f3f2f2"/>
  <rect x="0" y="0" width="1080" height="10" fill="#ec3013"/>

  <!-- Header -->
  <text x="540" y="100" text-anchor="middle" fill="#ae1800" font-size="20" letter-spacing="3" font-weight="700" font-family="Archivo,sans-serif">PRODUCTION INCIDENT</text>

  <text x="540" y="195" text-anchor="middle" fill="#201e1d" font-size="72" font-weight="800" font-family="Archivo,sans-serif">THE GHOST</text>
  <text x="540" y="275" text-anchor="middle" fill="#201e1d" font-size="72" font-weight="800" font-family="Archivo,sans-serif">CONNECTION</text>

  <text x="540" y="335" text-anchor="middle" fill="#201e1d" font-size="24" font-family="Archivo,sans-serif" opacity="0.65">How conntrack -F silently killed Redis pub/sub</text>
  <text x="540" y="368" text-anchor="middle" fill="#201e1d" font-size="24" font-family="Archivo,sans-serif" opacity="0.65">after every deploy — for 4 years.</text>

  <!-- Card 1: before deploy -->
  <rect x="60" y="430" width="960" height="190" fill="#eae9e9"/>
  <line x1="60" y1="525" x2="1020" y2="525" stroke="#201e1d" stroke-width="1" opacity="0.15"/>
  <text x="110" y="486" fill="#201e1d" font-size="24" font-weight="800" font-family="Archivo,sans-serif">CLIENT</text>
  <text x="970" y="486" text-anchor="end" fill="#201e1d" font-size="24" font-family="Archivo,sans-serif" opacity="0.7">connected</text>
  <text x="110" y="581" fill="#201e1d" font-size="24" font-weight="800" font-family="Archivo,sans-serif">REDIS</text>
  <text x="970" y="581" text-anchor="end" fill="#201e1d" font-size="24" font-family="Archivo,sans-serif" opacity="0.7">connected</text>

  <polygon points="520,650 560,650 540,685" fill="#ae1800"/>

  <!-- Card 2: right after conntrack -F -->
  <rect x="60" y="710" width="960" height="190" fill="#ec3013"/>
  <line x1="60" y1="805" x2="1020" y2="805" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <text x="110" y="766" fill="#ffffff" font-size="24" font-weight="800" font-family="Archivo,sans-serif">CLIENT</text>
  <text x="970" y="766" text-anchor="end" fill="#ffffff" font-size="24" font-family="Archivo,sans-serif" opacity="0.95">still thinks it's connected</text>
  <text x="110" y="861" fill="#ffffff" font-size="24" font-weight="800" font-family="Archivo,sans-serif">REDIS</text>
  <text x="970" y="861" text-anchor="end" fill="#ffffff" font-size="24" font-weight="800" font-family="Archivo,sans-serif">connection is gone</text>

  <polygon points="520,945 560,945 540,980" fill="#ae1800"/>

  <!-- Card 3: after heartbeat -->
  <rect x="60" y="990" width="960" height="190" fill="#eae9e9"/>
  <line x1="60" y1="1085" x2="1020" y2="1085" stroke="#201e1d" stroke-width="1" opacity="0.15"/>
  <text x="110" y="1046" fill="#201e1d" font-size="24" font-weight="800" font-family="Archivo,sans-serif">CLIENT</text>
  <text x="970" y="1046" text-anchor="end" fill="#201e1d" font-size="24" font-family="Archivo,sans-serif" opacity="0.7">reconnected</text>
  <text x="110" y="1141" fill="#201e1d" font-size="24" font-weight="800" font-family="Archivo,sans-serif">REDIS</text>
  <text x="970" y="1141" text-anchor="end" fill="#201e1d" font-size="24" font-family="Archivo,sans-serif" opacity="0.7">reconnected</text>

  <!-- Footer -->
  <text x="540" y="1230" text-anchor="middle" fill="#201e1d" font-size="14" letter-spacing="2" font-family="Archivo,sans-serif" opacity="0.5">REDIS · CONNTRACK · PRODUCTION DEBUGGING</text>
  <line x1="500" y1="1265" x2="580" y2="1265" stroke="#ae1800" stroke-width="3"/>
  <text x="540" y="1310" text-anchor="middle" fill="#ae1800" font-size="24" font-weight="800" font-family="Archivo,sans-serif">Full story → www.sku20.dev</text>

</svg>
