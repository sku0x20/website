<svg viewBox="0 0 1200 460" width="1200" height="460" xmlns="http://www.w3.org/2000/svg">

  <text x="600" y="28" text-anchor="middle" fill="#ae1800" font-size="15" letter-spacing="2" font-weight="700" font-family="Archivo,sans-serif">DEPLOY TIMELINE</text>

  <!-- Card 1: before deploy -->
  <rect x="20" y="70" width="340" height="360" fill="#eae9e9"/>
  <text x="190" y="110" text-anchor="middle" fill="#201e1d" font-size="17" font-weight="800" font-family="Archivo,sans-serif">Before the deploy swap</text>
  <line x1="20" y1="130" x2="360" y2="130" stroke="#201e1d" stroke-width="1" opacity="0.15"/>
  <text x="50" y="213" fill="#201e1d" font-size="22" font-weight="800" font-family="Archivo,sans-serif">CLIENT</text>
  <text x="330" y="213" text-anchor="end" fill="#201e1d" font-size="20" font-family="Archivo,sans-serif" opacity="0.7">connected</text>
  <line x1="20" y1="280" x2="360" y2="280" stroke="#201e1d" stroke-width="1" opacity="0.15"/>
  <text x="50" y="363" fill="#201e1d" font-size="22" font-weight="800" font-family="Archivo,sans-serif">REDIS</text>
  <text x="330" y="363" text-anchor="end" fill="#201e1d" font-size="20" font-family="Archivo,sans-serif" opacity="0.7">connected</text>

  <polygon points="380,230 380,270 415,250" fill="#ae1800"/>

  <!-- Card 2: right after conntrack -F -->
  <rect x="430" y="70" width="340" height="360" fill="#ec3013"/>
  <text x="600" y="110" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800" font-family="Archivo,sans-serif">Right after conntrack -F</text>
  <line x1="430" y1="130" x2="770" y2="130" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <text x="460" y="213" fill="#ffffff" font-size="22" font-weight="800" font-family="Archivo,sans-serif">CLIENT</text>
  <text x="740" y="213" text-anchor="end" fill="#ffffff" font-size="18" font-family="Archivo,sans-serif" opacity="0.95">still thinks it's connected</text>
  <line x1="430" y1="280" x2="770" y2="280" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <text x="460" y="363" fill="#ffffff" font-size="22" font-weight="800" font-family="Archivo,sans-serif">REDIS</text>
  <text x="740" y="363" text-anchor="end" fill="#ffffff" font-size="18" font-weight="800" font-family="Archivo,sans-serif">connection is gone</text>

  <polygon points="790,230 790,270 825,250" fill="#ae1800"/>

  <!-- Card 3: after heartbeat -->
  <rect x="840" y="70" width="340" height="360" fill="#eae9e9"/>
  <text x="1010" y="110" text-anchor="middle" fill="#201e1d" font-size="17" font-weight="800" font-family="Archivo,sans-serif">~1 min later (heartbeat)</text>
  <line x1="840" y1="130" x2="1180" y2="130" stroke="#201e1d" stroke-width="1" opacity="0.15"/>
  <text x="870" y="213" fill="#201e1d" font-size="22" font-weight="800" font-family="Archivo,sans-serif">CLIENT</text>
  <text x="1150" y="213" text-anchor="end" fill="#201e1d" font-size="20" font-family="Archivo,sans-serif" opacity="0.7">reconnected</text>
  <line x1="840" y1="280" x2="1180" y2="280" stroke="#201e1d" stroke-width="1" opacity="0.15"/>
  <text x="870" y="363" fill="#201e1d" font-size="22" font-weight="800" font-family="Archivo,sans-serif">REDIS</text>
  <text x="1150" y="363" text-anchor="end" fill="#201e1d" font-size="20" font-family="Archivo,sans-serif" opacity="0.7">reconnected</text>

</svg>
